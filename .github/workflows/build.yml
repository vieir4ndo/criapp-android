name: Build

on:
  push:
    branches:
      - main
      - 'issue#*'
      - 'hotfix/*'
      - 'release/*'
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build release APK
        run: ./gradlew assembleRelease

      - name: Rename APK
        if: github.ref == 'refs/heads/main'
        run: |
          DATE=$(date +'%Y%m%d')
          mv app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/criapp_${DATE}.apk

      - name: Upload APK artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: criapp-release
          path: app/build/outputs/apk/release/criapp_*.apk
          retention-days: 30
